# Sartor desktop release: thin caller for the app-hq shared Tauri pipeline.
#
# Push a release tag like v0.3.0 (the same tag as the PyPI release) to build,
# sign, notarize, and publish the installers. Manual dispatch runs the
# macOS notarize-check only and publishes nothing.
name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/tauri-release.yml@main
    with:
      product-name: Sartor
      project-path: desktop
      tauri-script: npx tauri
      install-command: npm ci --prefix desktop
      cache: ""
      preflight-command: ""
      updater: true
      release-body: |
        Sartor — privacy-first resume tailoring from your own evidence.

        Import your source material, tailor to a target role, flag anything
        unsupported, and render the finished bundle locally. No account and
        no telemetry; bring your own OpenAI-compatible or Anthropic
        provider, including local Ollama.

        macOS builds are signed and notarized. Windows and Linux builds are
        unsigned; first launch downloads a private Python runtime.
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  stable-assets:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            -R "$GITHUB_REPOSITORY" -D release-assets

      - name: Add stable asset aliases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          missing=0
          copy_first() {
            local pattern="$1" dest="$2"
            local files=( $pattern )
            if [ ${#files[@]} -gt 0 ]; then
              cp "${files[0]}" "$dest"
              echo "alias $dest <- ${files[0]}"
            else
              echo "::error::Missing release asset matching $pattern"
              missing=1
            fi
          }
          copy_first "*_aarch64.dmg" "Sartor-macOS-Apple-Silicon.dmg"
          copy_first "*_x64.dmg" "Sartor-macOS-Intel.dmg"
          copy_first "*_x64-setup.exe" "Sartor-Windows-x64-Setup.exe"
          copy_first "*_amd64.AppImage" "Sartor-Linux-x86_64.AppImage"
          [ "$missing" -eq 0 ]
          gh release upload "$GITHUB_REF_NAME" \
            Sartor-macOS-Apple-Silicon.dmg \
            Sartor-macOS-Intel.dmg \
            Sartor-Windows-x64-Setup.exe \
            Sartor-Linux-x86_64.AppImage \
            --clobber -R "$GITHUB_REPOSITORY"
