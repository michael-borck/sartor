[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sartor"
version = "0.3.0"
description = "Privacy-first resume tailoring: your evidence in, a tailored resume out — every claim traceable, nothing invented. Bring your own model (OpenAI-compatible, Ollama, Anthropic)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Borck", email = "michael.borck@curtin.edu.au" },
]
keywords = ["resume", "cv", "tailoring", "ats", "career", "llm", "privacy", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Document ingest + render (S-003, S-009).
import = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]
# PDF from the HTML output (S-009); heavy, stays optional.
pdf = ["weasyprint>=60.0"]
# JSON Resume schema validation (S-004).
schema = ["jsonschema>=4.20.0"]
# Local web UI (S-013).
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]
# Both providers (S-002) speak plain HTTPS via the core `requests`
# dependency — no vendor SDK extra is needed.
all = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "weasyprint>=60.0",
    "jsonschema>=4.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
sartor = "sartor.cli:app"

[project.urls]
Homepage = "https://github.com/michael-borck/sartor"
Repository = "https://github.com/michael-borck/sartor"
Issues = "https://github.com/michael-borck/sartor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sartor"]

[tool.hatch.build.targets.sdist]
exclude = ["dist", "**/._*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.29.4",
    "beautifulsoup4>=4.12.0",
    "build>=1.2.2",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "pypdf>=4.0.0",
    "pytest>=8.4.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "ruff>=0.12.0",
    "twine>=6.1.0",
    "uvicorn>=0.29.0",
    "weasyprint>=60.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sartor"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/._*"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
